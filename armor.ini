; ============================================================
; ARMOR 加壳参数配置文件
; 用法:  ArmorCLI pack 输入文件 输出文件 --config=armor.ini
; 格式:  每行一条 "key=value"，";" 或 "#" 开头为注释，空行忽略
; 优先级: 命令行参数 > 此配置文件 > 内置默认值
; 说明:  只写你需要自定义的项即可，未写的项用内置默认值
;
; 支持的输入: x86 (PE32) 与 x64 (PE32+) 的 EXE / DLL
;   架构与类型一律按 PE 格式自动判定，不看扩展名；
;   ArmorCLI.exe 自身编译为 x86 或 x64 都能给两种架构的目标加壳
;   （它同时内嵌了 x86 与 x64 两份运行时外壳）
; 不支持: 内核态映像 (.sys / Native 子系统)、.NET 程序、
;         16 位 DOS COM / DOS MZ / Win3.x NE、EFI 固件、ARM/ARM64 PE
; ============================================================

; 压缩级别 1..9（默认 6；越大压缩率越高、耗时越长）
level=6

; 载荷 RC4 加密：1=开启 0=关闭
encrypt=1

; 反调试动作：none=关闭  exit=检测到调试器直接退出  fake=检测到后行为异常
anti-debug=exit

; 反调试增强等级：1=基础 2=增强（检测调试窗口/进程名/计时）
anti-debug-level=1

; 反转储（anti-dump）：1=还原后抹掉 PE 头防 dump 0=关闭
anti-dump=1

; 易语言特征隐藏：auto|none|all|名称;名称
hide-features=auto

; 保留清单资源（权限/视觉样式）：1=保留 0=删除
keep-manifest=1

; 保留资源节（图标/版本版权）：1=原样保留 0=压缩（图标/版本信息会丢）
keep-rsrc=1

; 解包前校验载荷 CRC：1=开启 0=关闭
crc=1

; 随机种子：0=自动随机，非 0=固定（相同种子产生相同产物，便于复现）
seed=0

; 产物 PE 节名前缀（默认 arm -> .arm0/.armr/.arm1）
; 改为其他值可避开特征识别，如 shield -> .shield0/.shieldr/.shield1
; 限制：1..6 个字母数字（A-Z a-z 0-9）
section-prefix=arm

; 忽略"重复加壳"等告警：1=强制 0=关闭
force=0

; 允许对 DLL 压缩加壳（x86/x64 均可；保留导入/导出/重定位表，DLL 可正常加载调用）：1=开启 0=关闭
allow-dll=0

; 一键解压还原：1=对输入做脱壳，输出为还原后的原始 EXE/DLL（等价于命令行 --unpack 或独立子命令 unpack）
; 例：ArmorCLI pack 已加壳.exe 还原.exe --config=armor.ini
; 注意：设为 1 时该次调用只做解压还原，不做加壳
unpack=0
